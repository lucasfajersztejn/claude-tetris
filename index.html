<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title" aria-label="TETRIS">
    <span aria-hidden="true" style="--c: #e57373">T</span><span aria-hidden="true" style="--c: #ffb74d">E</span><span aria-hidden="true" style="--c: #ffd54f">T</span><span aria-hidden="true" style="--c: #81c784">R</span><span aria-hidden="true" style="--c: #4dd0e1">I</span><span aria-hidden="true" style="--c: #ba68c8">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <aside class="hold-panel">
        <span class="hold-title" aria-label="HOLD"><span aria-hidden="true" style="--c: #ba68c8">H</span><span aria-hidden="true" style="--c: #4dd0e1">O</span><span aria-hidden="true" style="--c: #ffb74d">L</span><span aria-hidden="true" style="--c: #81c784">D</span></span>
        <canvas id="hold-canvas" width="120" height="120"></canvas>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Tema claro" title="Cambiar tema">
            <span class="theme-word theme-dark" aria-hidden="true"><span style="--c: #ba68c8">D</span><span style="--c: #4dd0e1">A</span><span style="--c: #e57373">R</span><span style="--c: #ffd54f">K</span></span>
            <span class="theme-track" aria-hidden="true"><span class="theme-knob"></span></span>
            <span class="theme-word theme-light" aria-hidden="true"><span style="--c: #ffb74d">L</span><span style="--c: #ffd54f">I</span><span style="--c: #81c784">G</span><span style="--c: #4dd0e1">H</span><span style="--c: #e57373">T</span></span>
          </button>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>H</kbd> guardar</li>
            <li><kbd>J</kbd> soltar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
